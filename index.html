<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff6f2"><title>கோவமா இருக்கியா? 💌</title>
<style>
:root{--ink:#442d3d;--pink:#f06c8d;--coral:#ff9b82;--cream:#fff8f3}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 20% 15%,#ffe1e7 0,transparent 38%),radial-gradient(ellipse at 85% 85%,#e8e0ff 0,transparent 36%),var(--cream);color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;overflow:hidden}.card{width:min(100%,520px);min-height:410px;padding:clamp(30px,7vw,52px) 26px 38px;border:1px solid #fff;background:#ffffffc9;backdrop-filter:blur(12px);border-radius:32px;box-shadow:0 24px 80px #87546c20;text-align:center;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center}.spark{font-size:38px;margin-bottom:18px}.eyebrow{margin:0 0 12px;color:#a16f83;font-size:12px;letter-spacing:.18em;text-transform:uppercase}h1{font-size:clamp(34px,8vw,48px);line-height:1.12;margin:0 0 14px;letter-spacing:-.04em}p{color:#806c78;line-height:1.55;margin:0 auto 28px;max-width:350px}.buttons{height:62px;display:flex;justify-content:center;align-items:center;gap:16px;width:100%}button{font-family:inherit;font-size:16px;font-weight:700;border:0;border-radius:999px;padding:15px 28px;cursor:pointer;transition:transform .18s,box-shadow .18s;touch-action:none}.yes{color:white;background:linear-gradient(135deg,var(--pink),var(--coral));box-shadow:0 9px 22px #ef79904a;position:fixed;z-index:3}.no{color:#806c78;background:#f5eff4;box-shadow:0 5px 15px #60435815}.result{animation:pop .45s cubic-bezier(.2,.8,.2,1) both}.portrait{display:block;width:min(68vw,260px);aspect-ratio:3/4;object-fit:cover;object-position:center 24%;margin:10px auto 18px;border-radius:22px;border:5px solid white;box-shadow:0 14px 32px #442d3d25}.hidden{display:none!important}.again{margin-top:10px;background:#f5eff4;color:#745568;font-size:13px;padding:11px 17px}@keyframes pop{from{opacity:0;transform:scale(.9) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}.heart{position:fixed;bottom:-32px;pointer-events:none;animation:rise 4s linear forwards;z-index:0}@keyframes rise{to{transform:translateY(-110vh) rotate(24deg);opacity:0}}@media(max-width:420px){.card{min-height:390px}.buttons{gap:10px}button{padding:14px 22px}}
</style></head>
<body><main class="card"><section id="question"><div class="spark" aria-hidden="true">💌</div><div class="eyebrow">a tiny peace offering</div><h1>கோவமா இருக்கியா?</h1><p>Kovama irukiya? 🥺</p><div class="buttons"><button class="no" id="no">No 🙈</button><button class="yes" id="yes">Yes 😤</button></div></section><section id="result" class="hidden result"><div class="spark" aria-hidden="true">💛</div><div class="eyebrow">peace restored</div><h1>Thank you! 🥹</h1><p style="font-size:22px;font-weight:700;color:#9c4863">Missed you a lot 💛</p><img class="portrait" src="portrait.jpg" alt="A painted portrait revealed with the thank-you message"><button class="again" id="again">Ask me again ↺</button></section></main>
<script>
const yes=document.querySelector('#yes'),no=document.querySelector('#no'),question=document.querySelector('#question'),result=document.querySelector('#result');
function dodge(){const pad=14,w=yes.offsetWidth,h=yes.offsetHeight;let x=pad+Math.random()*Math.max(1,innerWidth-w-2*pad),y=pad+Math.random()*Math.max(1,innerHeight-h-2*pad);yes.style.left=x+'px';yes.style.top=y+'px'}
function placeBesideNo(){const r=no.getBoundingClientRect(),w=yes.offsetWidth,gap=12;let x=r.right+gap;if(x+w>innerWidth-12)x=Math.max(12,r.left-w-gap);yes.style.left=x+'px';yes.style.top=r.top+'px'}
yes.addEventListener('pointerenter',dodge);yes.addEventListener('pointerdown',e=>{e.preventDefault();dodge()});document.addEventListener('pointermove',e=>{if(yes.classList.contains('hidden'))return;const r=yes.getBoundingClientRect(),cx=(r.left+r.right)/2,cy=(r.top+r.bottom)/2;if(Math.hypot(e.clientX-cx,e.clientY-cy)<34)dodge()});window.addEventListener('resize',placeBesideNo);no.addEventListener('click',()=>{question.classList.add('hidden');result.classList.remove('hidden');yes.classList.add('hidden');for(let i=0;i<18;i++)setTimeout(heart,i*90)});
document.querySelector('#again').addEventListener('click',()=>{result.classList.add('hidden');question.classList.remove('hidden');yes.classList.remove('hidden');placeBesideNo()});
function heart(){const el=document.createElement('div');el.className='heart';el.textContent=['💗','✨','🌸','💛'][Math.floor(Math.random()*4)];el.style.left=Math.random()*100+'vw';el.style.fontSize=(18+Math.random()*18)+'px';document.body.append(el);setTimeout(()=>el.remove(),4200)}
requestAnimationFrame(placeBesideNo);
</script></body></html>
